<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="auto">
  <defs>
    <!-- Optical Darkroom Gradients -->
    <radialGradient id="opticVoid" cx="72%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181326" />
      <stop offset="45%" stop-color="#0B0914" />
      <stop offset="100%" stop-color="#040308" />
    </radialGradient>

    <!-- Chromatic Prism Radiance -->
    <radialGradient id="prismGlow" cx="74%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4" />
      <stop offset="30%" stop-color="#F43F5E" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#040308" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="lensBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#F43F5E" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9" />
    </linearGradient>

    <!-- Pixel Sensor Grid Matrix -->
    <pattern id="pixelGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="16" height="16" fill="none" stroke="#06B6D4" stroke-opacity="0.08" stroke-width="0.7" />
      <circle cx="8" cy="8" r="0.6" fill="#F43F5E" opacity="0.15" />
    </pattern>

    <!-- Keyframe Motion Animations -->
    <style>
      @keyframes irisRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes histogramPulse {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.35); }
      }
      @keyframes crosshairBlink {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes loupeTrace {
        0% { transform: translate(0, 0); }
        50% { transform: translate(-8px, -12px); }
        100% { transform: translate(0, 0); }
      }

      .aperture-iris {
        transform-origin: 740px 145px;
        animation: irisRotate 24s linear infinite;
      }
      .histogram-wave {
        transform-origin: 740px 190px;
        animation: histogramPulse 2.8s ease-in-out infinite;
      }
      .optic-reticle {
        animation: crosshairBlink 2s ease-in-out infinite;
      }
      .pixel-loupe {
        animation: loupeTrace 5s ease-in-out infinite;
      }

      .headline-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Geist Sans", sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
        fill: #FDF4FF;
      }
      .mono-chip {
        font-family: "JetBrains Mono", Consolas, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Darkroom Sensor Plate -->
  <rect width="960" height="320" rx="24" fill="url(#opticVoid)" />
  <rect width="960" height="320" rx="24" fill="url(#pixelGrid)" />
  <rect width="960" height="320" rx="24" fill="url(#prismGlow)" />
  
  <!-- Outer Chromatic Beveled Rim -->
  <rect x="2" y="2" width="956" height="316" rx="22" fill="none" stroke="url(#lensBorder)" stroke-width="1.8" />
  <path d="M 28 6 L 932 6" stroke="#67E8F9" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" />

  <!-- ==================== OPTICAL APERTURE IRIS & PIXEL INSPECTOR ==================== -->

  <!-- Lens Element Barrel Outer Rings -->
  <circle cx="740" cy="145" r="115" fill="none" stroke="#06B6D4" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.4" />
  <circle cx="740" cy="145" r="85" fill="none" stroke="#F43F5E" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.5" />
  <circle cx="740" cy="145" r="55" fill="none" stroke="#F59E0B" stroke-width="0.9" opacity="0.6" />

  <!-- Optical Millimeter Tick Marks -->
  <g class="aperture-iris" opacity="0.75">
    <line x1="740" y1="30" x2="740" y2="40" stroke="#06B6D4" stroke-width="1.5" />
    <line x1="740" y1="250" x2="740" y2="260" stroke="#06B6D4" stroke-width="1.5" />
    <line x1="625" y1="145" x2="635" y2="145" stroke="#F43F5E" stroke-width="1.5" />
    <line x1="845" y1="145" x2="855" y2="145" stroke="#F43F5E" stroke-width="1.5" />
    <!-- 8-Blade Iris Geometry -->
    <path d="M 700 110 L 780 120 L 760 180 L 680 170 Z" fill="none" stroke="#06B6D4" stroke-width="1.2" opacity="0.5" />
    <path d="M 740 100 L 780 160 L 720 190 L 680 130 Z" fill="none" stroke="#F43F5E" stroke-width="1.2" opacity="0.5" />
  </g>

  <!-- Precision Optical Crosshair Reticle -->
  <g class="optic-reticle">
    <line x1="680" y1="145" x2="800" y2="145" stroke="#67E8F9" stroke-width="0.9" stroke-dasharray="6 4" />
    <line x1="740" y1="85" x2="740" y2="205" stroke="#67E8F9" stroke-width="0.9" stroke-dasharray="6 4" />
    <circle cx="740" cy="145" r="10" fill="#0C1B29" stroke="#06B6D4" stroke-width="1.8" />
    <circle cx="740" cy="145" r="3" fill="#FFFFFF" />
  </g>

  <!-- RGB Luminance Histogram Curve (Bottom Overlay) -->
  <g class="histogram-wave" transform="translate(640, 195)">
    <!-- Red Channel Curve -->
    <path d="M 0 0 Q 30 -25 60 -10 T 120 -35 T 180 0" fill="none" stroke="#F43F5E" stroke-width="1.4" opacity="0.8" />
    <!-- Green/Cyan Channel Curve -->
    <path d="M 0 0 Q 40 -15 80 -30 T 140 -10 T 180 0" fill="none" stroke="#06B6D4" stroke-width="1.4" opacity="0.85" />
    <!-- Blue/Violet Channel Curve -->
    <path d="M 0 0 Q 20 -30 70 -5 T 130 -25 T 180 0" fill="none" stroke="#8B5CF6" stroke-width="1.2" opacity="0.75" />
  </g>

  <!-- Live Pixel Inspector HUD Card -->
  <g transform="translate(635, 248)" class="mono-chip">
    <rect x="0" y="0" width="285" height="46" rx="10" fill="#0E0B1A" stroke="#4C1D95" stroke-width="1" opacity="0.95" />
    <circle cx="14" cy="17" r="3.5" fill="#06B6D4" />
    <text x="26" y="20" fill="#67E8F9" font-size="10" font-weight="700">LUMINANCE: 0.842 · CIE-LAB 4:4:4</text>
    <text x="14" y="36" fill="#F472B6" font-size="8.5">RGB HISTOGRAM: NORMALIZED · CANVAS ACCELERATED</text>
  </g>

  <!-- ==================== LEFT EDITORIAL & IDENTITY BLOCK ==================== -->
  <g transform="translate(52, 54)">
    <rect x="0" y="0" width="245" height="28" rx="14" fill="#1C102E" stroke="#6D28D9" stroke-width="1.2" />
    <circle cx="14" cy="14" r="4.5" fill="#06B6D4" />
    <text x="28" y="18" fill="#67E8F9" class="mono-chip" font-size="11" font-weight="700">COMPUTER VISION · OPTICAL LAB</text>

    <text x="0" y="80" class="headline-text" font-size="44">KIDIUVISION</text>

    <text x="0" y="122" fill="#E9D5FF" font-size="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
      Client-Side Pixel Inspection, Luminance Analytics &amp; Image Telemetry
    </text>

    <!-- Chromatic Prism Accent Strip -->
    <g transform="translate(0, 146)">
      <rect x="0" y="0" width="45" height="3" fill="#06B6D4" rx="1.5" />
      <rect x="49" y="0" width="55" height="3" fill="#F43F5E" rx="1.5" />
      <rect x="108" y="0" width="35" height="3" fill="#F59E0B" rx="1.5" />
    </g>

    <!-- Tech Specs Badges -->
    <g transform="translate(0, 182)" class="mono-chip" font-size="10.5">
      <rect x="0" y="0" width="130" height="22" rx="6" fill="#130E24" stroke="#4C1D95" stroke-width="1" />
      <text x="12" y="15" fill="#67E8F9">HTML5 CANVAS</text>

      <rect x="140" y="0" width="138" height="22" rx="6" fill="#130E24" stroke="#4C1D95" stroke-width="1" />
      <text x="152" y="15" fill="#F472B6">PIXEL INSPECTOR</text>

      <rect x="288" y="0" width="128" height="22" rx="6" fill="#130E24" stroke="#4C1D95" stroke-width="1" />
      <text x="300" y="15" fill="#FDE68A">RGB HISTOGRAM</text>
    </g>

    <g transform="translate(0, 230)">
      <text x="0" y="0" fill="#665385" class="mono-chip" font-size="9.5">
        DIU FOUNDRY · ZERO-DEPENDENCY BROWSER VISUAL INTELLIGENCE
      </text>
    </g>
  </g>
</svg>